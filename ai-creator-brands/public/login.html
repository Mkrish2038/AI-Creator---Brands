<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - AI Creator - Brands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <a class="back" href="/">&larr; Change account type</a>
      <div><span class="role-tag" id="roleTag"></span></div>

      <section id="stepEmail">
        <h1>Log in</h1>
        <p class="sub">Enter your email. We will send a 6-digit code. No password needed.</p>
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
        <button class="btn" id="sendBtn">Send code</button>
      </section>

      <section id="stepOtp" class="hidden">
        <h1>Enter your code</h1>
        <p class="sub" id="otpSub"></p>
        <label for="otp">6-digit code</label>
        <input id="otp" class="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
        <button class="btn" id="verifyBtn">Log in</button>
        <div class="row">
          <button class="link-btn" id="changeEmail">Use a different email</button>
          <button class="link-btn" id="resendBtn" disabled>Resend code</button>
        </div>
      </section>

      <div class="error" id="error" role="alert"></div>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
